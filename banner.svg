<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none" role="img" aria-label="Kritika Jha — Software Engineer">
  <defs>
    <!-- backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060F"/>
      <stop offset="55%" stop-color="#08061A"/>
      <stop offset="100%" stop-color="#04040A"/>
    </linearGradient>
    <radialGradient id="auraV" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraC" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraP" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

    <!-- the sphere -->
    <radialGradient id="orb" cx="34%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="26%" stop-color="#7C3AED"/>
      <stop offset="62%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#170B3B"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="93%" stop-color="#22D3EE" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity=".55"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#C4B5FD"/>
      <stop offset="72%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <!-- organic distortion for the orb -->
    <filter id="warp" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="3" seed="11" result="n">
        <animate attributeName="baseFrequency" values="0.009;0.016;0.009" dur="14s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glowLg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="glowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#8B5CF6" stroke-opacity=".085">
      <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
      <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380M720 0V380M780 0V380M840 0V380M900 0V380M960 0V380M1020 0V380M1080 0V380M1140 0V380"/>
    </g>

    <!-- ambient light -->
    <ellipse cx="905" cy="180" rx="330" ry="300" fill="url(#auraV)"/>
    <ellipse cx="1090" cy="330" rx="240" ry="210" fill="url(#auraC)"/>
    <ellipse cx="700" cy="40" rx="220" ry="180" fill="url(#auraP)"/>

    <!-- stars -->
    <g fill="#E9E7FF">
      <circle cx="70" cy="52" r="1.5" opacity=".5"><animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="300" r="1.2" opacity=".4"><animate attributeName="opacity" values=".15;.7;.15" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="88" r="1" opacity=".35"><animate attributeName="opacity" values=".1;.6;.1" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="455" cy="330" r="1.4" opacity=".45"><animate attributeName="opacity" values=".2;.85;.2" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="150" r="1.1" opacity=".3"/>
      <circle cx="760" cy="330" r="1.6" opacity=".5"><animate attributeName="opacity" values=".2;.9;.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="90" r="1.3" opacity=".45"><animate attributeName="opacity" values=".15;.8;.15" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="46" r="1" opacity=".3"/>
      <circle cx="255" cy="200" r="1" opacity=".25"/>
      <circle cx="530" cy="60" r="1.2" opacity=".35"><animate attributeName="opacity" values=".1;.65;.1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="352" r="1.1" opacity=".3"/>
      <circle cx="1120" cy="240" r="1.4" opacity=".4"><animate attributeName="opacity" values=".15;.75;.15" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ═══ the 3D orb ═══ -->
    <g transform="translate(890 186)">
      <!-- bloom -->
      <circle r="132" fill="#7C3AED" opacity=".5" filter="url(#glowLg)"/>

      <!-- morphing body -->
      <g filter="url(#warp)">
        <circle r="104" fill="url(#orb)"/>
      </g>
      <!-- fresnel rim -->
      <circle r="106" fill="url(#rim)" opacity=".9"/>
      <!-- specular -->
      <ellipse cx="-34" cy="-42" rx="26" ry="17" fill="#FFFFFF" opacity=".22" transform="rotate(-28)"/>

      <!-- orbital rings -->
      <g opacity=".85">
        <g>
          <ellipse rx="150" ry="48" fill="none" stroke="#22D3EE" stroke-opacity=".8" stroke-width="1.4" filter="url(#glowSm)" transform="rotate(-24)"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
        </g>
        <g>
          <ellipse rx="168" ry="58" fill="none" stroke="#8B5CF6" stroke-opacity=".7" stroke-width="1.2" filter="url(#glowSm)" transform="rotate(58)"/>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="34s" repeatCount="indefinite"/>
        </g>
        <g>
          <ellipse rx="182" ry="26" fill="none" stroke="#F472B6" stroke-opacity=".55" stroke-width="1" filter="url(#glowSm)" transform="rotate(14)"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- travelling node -->
      <circle r="4" fill="#22D3EE" filter="url(#glowSm)">
        <animateMotion dur="26s" repeatCount="indefinite" path="M150,0 A150,48 0 1,1 -150,0 A150,48 0 1,1 150,0" rotate="auto"/>
      </circle>
    </g>

    <!-- ═══ copy ═══ -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <g transform="translate(72 104)">
        <circle cx="4" cy="-5" r="4" fill="#34D399">
          <animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="20" y="0" fill="#9CA3C4" font-size="12.5" letter-spacing="3.6" font-family="'SFMono-Regular', Consolas, monospace">OPEN TO OPPORTUNITIES · BANGALORE, INDIA</text>
      </g>

      <text x="72" y="196" font-size="76" font-weight="700" letter-spacing="-2" fill="url(#nameGrad)">KRITIKA JHA</text>

      <rect x="74" y="216" width="330" height="1.6" fill="url(#ruleGrad)"/>

      <text x="72" y="256" font-size="16.5" letter-spacing="2.4" fill="#CBD5F5" font-family="'SFMono-Regular', Consolas, monospace">SOFTWARE ENGINEER 1 @ URBAN COMPANY</text>

      <g font-size="12.5" font-family="'SFMono-Regular', Consolas, monospace">
        <g transform="translate(72 292)">
          <rect width="94" height="27" rx="13.5" fill="#8B5CF6" fill-opacity=".14" stroke="#8B5CF6" stroke-opacity=".5"/>
          <text x="47" y="18" fill="#C4B5FD" text-anchor="middle">React · RN</text>
        </g>
        <g transform="translate(176 292)">
          <rect width="104" height="27" rx="13.5" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".45"/>
          <text x="52" y="18" fill="#7DD3FC" text-anchor="middle">Node · TS</text>
        </g>
        <g transform="translate(290 292)">
          <rect width="92" height="27" rx="13.5" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".45"/>
          <text x="46" y="18" fill="#F9A8D4" text-anchor="middle">AI / LLM</text>
        </g>
        <g transform="translate(392 292)">
          <rect width="118" height="27" rx="13.5" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".18"/>
          <text x="59" y="18" fill="#A5B4CF" text-anchor="middle">650+ DSA</text>
        </g>
      </g>
    </g>

    <rect width="1200" height="380" rx="18" fill="none" stroke="#8B5CF6" stroke-opacity=".22"/>
  </g>
</svg>
